services:
  # The application service
  app:
    # Use the environment variable to pull the specific version. 
    # If IMAGE_TAG is not set (running manually), it defaults to 'latest'.
    image: boring-app:${IMAGE_TAG:-latest}
    container_name: boring-app-container
    ports:
      - "5000:5000"
    restart: always
    environment:
      - ENV=production

  # Optional: Add a database or other dependencies here in the future
